<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1e293b"/></marker></defs><rect width="1200" height="900" fill="white"/><text font-family="Arial, sans-serif" font-size="32" fill="#1e293b" text-anchor="start"><tspan x="40" y="57.0">Build team - one orchestrator, bounded workers</tspan></text><text font-family="Arial, sans-serif" font-size="21" fill="#1e293b" text-anchor="start"><tspan x="40" y="99.0">Repeat for each slice. Sol accepts work; no worker marks the main task done.</tspan></text><rect x="410" y="135" width="380" height="115" rx="12" fill="#d0bfff" stroke="#1e293b" stroke-width="1.5"/><text font-family="Arial, sans-serif" font-size="24" fill="#1e293b" text-anchor="middle"><tspan x="600.0" y="171.5">GPT-6.1 Sol</tspan><tspan x="600.0" y="201.5">plan / contracts / ownership</tspan><tspan x="600.0" y="231.5">integration decisions</tspan></text><polyline points="500,250 285,360" fill="none" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="700,250 915,360" fill="none" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/><text font-family="Arial, sans-serif" font-size="22" fill="#1e293b" text-anchor="start"><tspan x="70" y="317.0">Brief + relevant context</tspan></text><rect x="70" y="360" width="430" height="135" rx="12" fill="#a5d8ff" stroke="#1e293b" stroke-width="1.5"/><text font-family="Arial, sans-serif" font-size="23" fill="#1e293b" text-anchor="middle"><tspan x="285.0" y="407.375">Luna high</tspan><tspan x="285.0" y="436.125">Data / rules / corrections / memory</tspan><tspan x="285.0" y="464.875">assigned files + focused checks</tspan></text><text font-family="Arial, sans-serif" font-size="22" fill="#1e293b" text-anchor="start"><tspan x="900" y="317.0">Brief + UI contract</tspan></text><rect x="700" y="360" width="430" height="135" rx="12" fill="#a5d8ff" stroke="#1e293b" stroke-width="1.5"/><text font-family="Arial, sans-serif" font-size="23" fill="#1e293b" text-anchor="middle"><tspan x="915.0" y="407.375">Luna medium</tspan><tspan x="915.0" y="436.125">Bounded UI components / docs</tspan><tspan x="915.0" y="464.875">assigned files + browser handoff</tspan></text><polyline points="285,495 500,600" fill="none" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="915,495 700,600" fill="none" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/><text font-family="Arial, sans-serif" font-size="21" fill="#1e293b" text-anchor="start"><tspan x="80" y="561.0">Change report + test evidence</tspan></text><text font-family="Arial, sans-serif" font-size="21" fill="#1e293b" text-anchor="start"><tspan x="955" y="561.0">Report + limits</tspan></text><rect x="410" y="600" width="380" height="125" rx="12" fill="#ffd8a8" stroke="#1e293b" stroke-width="1.5"/><text font-family="Arial, sans-serif" font-size="23" fill="#1e293b" text-anchor="middle"><tspan x="600.0" y="642.375">Sol reviews and verifies</tspan><tspan x="600.0" y="671.125">read changes / rerun checks</tspan><tspan x="600.0" y="699.875">inspect actual user behavior</tspan></text><polyline points="600,725 600,795" fill="none" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="150" y="795" width="900" height="65" rx="12" fill="#b2f2bb" stroke="#1e293b" stroke-width="1.5"/><text font-family="Arial, sans-serif" font-size="22" fill="#1e293b" text-anchor="middle"><tspan x="600.0" y="835.75">Accepted: update checklist + state + decisions; assign the next slice</tspan></text><text font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="start"><tspan x="40" y="752.0">If checks fail: return one specific</tspan><tspan x="40" y="777.0">repair task with reproduction.</tspan></text></svg>
